<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIWI · Advance Tax Invoice · July 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-overlay.hidden {
            display: none;
        }

        .login-box {
            background: white;
            padding: 2.5rem 3rem;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 100%;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-box h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #0b2b3f;
        }

        .login-box .subtitle {
            color: #6e879b;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }

        .login-box .form-group {
            margin-bottom: 1.2rem;
        }

        .login-box .form-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #4f6b7d;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #d5dfe8;
            border-radius: 12px;
            font-size: 0.95rem;
            background: white;
            outline: none;
        }

        .login-box .form-group input:focus {
            border-color: #0b2b3f;
            box-shadow: 0 0 0 3px rgba(11,43,63,0.08);
        }

        .login-box .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: #0b2b3f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 0.5rem;
        }

        .login-box .login-btn:hover {
            background: #1a4058;
        }

        .login-box .login-btn-user {
            background: #0f7b3e;
        }

        .login-box .login-btn-user:hover {
            background: #129446;
        }

        .login-box .login-error {
            color: #b91c1c;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            text-align: center;
            min-height: 1.5rem;
        }

        .login-box .login-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .login-box .login-options {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .login-box .login-options .login-btn {
            flex: 1;
            text-align: center;
        }

        .container {
            max-width: 1440px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            padding: 1.5rem 1.5rem 2.5rem;
        }

        .container.hidden {
            display: none;
        }

        .report-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9eef3;
            padding-bottom: 1.25rem;
            margin-bottom: 1.75rem;
            gap: 1rem 0.5rem;
        }

        .report-header h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #0b2b3f;
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
        }

        .month-badge {
            background: #e2eaf1;
            padding: 0.5rem 1.4rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a3b4f;
        }

        .btn {
            background: white;
            border: 1px solid #d0dce8;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1f3e52;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #0b2b3f;
            border-color: #0b2b3f;
            color: white;
        }

        .btn-primary:hover {
            background: #1a4058;
        }

        .btn-success {
            background: #0f7b3e;
            border-color: #0f7b3e;
            color: white;
        }

        .btn-success:hover {
            background: #129446;
        }

        .btn-danger {
            background: #b91c1c;
            border-color: #b91c1c;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-danger-small {
            background: #dc2626;
            border: none;
            color: white;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-danger-small:hover {
            background: #b91c1c;
        }

        .btn-danger-small.disabled {
            background: #9ca3af;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-danger-small.disabled:hover {
            background: #9ca3af;
        }

        .add-form {
            background: #f8fafc;
            padding: 1.2rem 1.5rem;
            border-radius: 20px;
            border: 1px solid #e2eaf1;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 0.8rem 1rem;
        }

        .add-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1 1 130px;
        }

        .add-form .form-group label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #4f6b7d;
            font-weight: 600;
        }

        .add-form .form-group input {
            padding: 0.5rem 0.7rem;
            border: 1px solid #d5dfe8;
            border-radius: 10px;
            font-size: 0.85rem;
            background: white;
            outline: none;
        }

        .add-form .form-group input:focus {
            border-color: #0b2b3f;
            box-shadow: 0 0 0 3px rgba(11,43,63,0.08);
        }

        .add-form .form-group input.readonly-field {
            background: #f3f4f6;
            color: #4b5563;
            cursor: not-allowed;
            opacity: 0.8;
        }

        .add-form .form-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            padding-bottom: 0.1rem;
        }

        .auto-hint {
            font-size: 0.65rem;
            color: #0f7b3e;
            font-weight: 500;
            margin-top: 0.1rem;
            min-height: 1.2rem;
        }

        .date-filter-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem 1.5rem;
            background: #f8fafc;
            padding: 0.7rem 1.5rem;
            border-radius: 60px;
            margin-bottom: 1.5rem;
            border: 1px solid #e2eaf1;
        }

        .date-filter-section label {
            font-weight: 500;
            color: #1f3e52;
            font-size: 0.85rem;
        }

        .date-filter-section input[type="date"] {
            padding: 0.5rem 0.7rem;
            border: 1px solid #d5dfe8;
            border-radius: 10px;
            font-size: 0.85rem;
            background: white;
            outline: none;
        }

        .date-filter-section input[type="date"]:focus {
            border-color: #0b2b3f;
            box-shadow: 0 0 0 3px rgba(11,43,63,0.08);
        }

        .date-filter-section .date-range-sep {
            color: #6e879b;
            font-weight: 500;
        }

        .date-filter-section .btn-filter {
            background: #0b2b3f;
            border: none;
            color: white;
            padding: 0.45rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .date-filter-section .btn-filter:hover {
            background: #1a4058;
        }

        .date-filter-section .btn-clear-date {
            background: transparent;
            border: none;
            color: #6e879b;
            font-size: 0.8rem;
            padding: 0 0.6rem;
            cursor: pointer;
            font-weight: 500;
        }

        .date-filter-section .btn-clear-date:hover {
            color: #1f3e52;
        }

        .search-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem 1.5rem;
            background: #f8fafc;
            padding: 0.7rem 1.5rem;
            border-radius: 60px;
            margin-bottom: 1.5rem;
            border: 1px solid #e2eaf1;
        }

        .search-section label {
            font-weight: 500;
            color: #1f3e52;
            font-size: 0.85rem;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 60px;
            border: 1px solid #d5dfe8;
            padding: 0.2rem 0.2rem 0.2rem 1rem;
            flex: 1 1 260px;
        }

        .search-input-wrapper:focus-within {
            border-color: #0b2b3f;
            box-shadow: 0 0 0 3px rgba(11,43,63,0.08);
        }

        .search-input-wrapper input {
            border: none;
            padding: 0.55rem 0;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            background: transparent;
            color: #1a2e3d;
        }

        .search-input-wrapper input::placeholder {
            color: #9aafbe;
        }

        .search-input-wrapper button {
            background: #0b2b3f;
            border: none;
            color: white;
            padding: 0.45rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .search-input-wrapper button:hover {
            background: #1a4058;
        }

        .search-clear {
            background: transparent;
            border: none;
            color: #6e879b;
            font-size: 0.8rem;
            padding: 0 0.6rem;
            cursor: pointer;
            font-weight: 500;
        }

        .search-clear:hover {
            color: #1f3e52;
        }

        .result-count {
            font-size: 0.85rem;
            color: #2f4d64;
            font-weight: 450;
            margin-left: 0.2rem;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            background: #f8fafc;
            padding: 1.2rem 1.5rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            border: 1px solid #e2eaf1;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
        }

        .summary-item .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #4f6b7d;
            font-weight: 600;
        }

        .summary-item .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0b2b3f;
            margin-top: 0.2rem;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 18px;
            border: 1px solid #e9edf2;
            background: white;
            margin-top: 0.25rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 900px;
        }

        th {
            background: #f2f6fa;
            color: #1f3e52;
            font-weight: 600;
            padding: 0.9rem 0.8rem;
            text-align: left;
            border-bottom: 2px solid #dbe1e8;
            white-space: nowrap;
            font-size: 0.78rem;
            text-transform: uppercase;
        }

        td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
            color: #1f2e3b;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .party-name {
            font-weight: 500;
            color: #0b2b3f;
            white-space: nowrap;
        }

        .text-right {
            text-align: right;
        }

        .text-center {
            text-align: center;
        }

        .empty-row td {
            color: #8f9fad;
            font-style: italic;
            padding: 1.5rem 0.8rem;
            text-align: center;
        }

        .delete-cell {
            text-align: center;
            white-space: nowrap;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #d0dce8;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1f3e52;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #f2f6fb;
        }

        .user-role-badge {
            font-size: 0.75rem;
            padding: 0.3rem 1rem;
            border-radius: 60px;
            background: #0b2b3f;
            color: white;
            font-weight: 500;
        }

        .user-role-badge.user {
            background: #0f7b3e;
        }

        .user-restriction-notice {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 12px;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #92400e;
            display: none;
        }

        .user-restriction-notice.visible {
            display: block;
        }

        .footer-note {
            margin-top: 1.5rem;
            padding: 0.8rem 1rem 0.2rem;
            font-size: 0.8rem;
            color: #577184;
            border-top: 1px dashed #d5dfe8;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .file-sync-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #92400e;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 12px;
            padding: 0.5rem 1rem;
            margin-bottom: 1rem;
        }

        .file-sync-status.connected {
            color: #0f7b3e;
            background: #e6f7ed;
            border-color: #0f7b3e;
        }

        .file-sync-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
            flex-shrink: 0;
        }

        .file-sync-status.connected .dot {
            background: #0f7b3e;
        }

        .footer-credits {
            margin-top: 0.4rem;
            padding: 0 1rem;
            font-size: 0.75rem;
            color: #8a9bab;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.3rem 1rem;
        }

        @media print {
            body { background: white; padding: 0.5rem; }
            .container { box-shadow: none; border: 1px solid #ccc; border-radius: 12px; }
            .btn, .search-section, .header-actions .btn, .add-form, .delete-cell, .date-filter-section, .file-sync-status { display: none !important; }
            .report-header { border-bottom-color: #aaa; }
            .summary-cards { background: #f5f7fa; border-color: #ccc; }
            .table-wrapper { border-color: #aaa; }
            th { background: #e9edf2 !important; }
            .footer-note { border-top-color: #aaa; }
            .search-section { display: none !important; }
            .logout-btn { display: none !important; }
            .user-role-badge { display: none !important; }
            .user-restriction-notice { display: none !important; }
            .date-filter-section { display: none !important; }
        }

        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .report-header h1 { font-size: 1.3rem; }
            .summary-cards { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
            .summary-item .value { font-size: 1.2rem; }
            .search-section { border-radius: 20px; padding: 0.7rem 1rem; }
            .search-input-wrapper { flex: 1 1 100%; }
            .add-form .form-group { flex: 1 1 100%; }
            .login-box { padding: 2rem 1.5rem; }
            .login-box .login-options {
                flex-direction: column;
            }
            .date-filter-section {
                border-radius: 20px;
                padding: 0.7rem 1rem;
            }
            .date-filter-section input[type="date"] {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN OVERLAY ===== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <div class="login-icon">🔐</div>
            <h2>KIWI · Tax Invoice System</h2>
            <p class="subtitle">Enter your credentials to continue</p>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUser" placeholder="Enter username" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Enter password" />
            </div>
            <div class="login-options">
                <button class="login-btn" id="adminLoginBtn">👑 Admin</button>
                <button class="login-btn login-btn-user" id="userLoginBtn">👤 User</button>
            </div>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container hidden" id="mainContainer">
        <div id="appContent"></div>
    </div>

    <script>
        // ============================================================
        // GOOGLE SHEET SYNC  —  PASTE YOUR WEB APP URL HERE
        // You get this URL after deploying the Apps Script (see the
        // step-by-step guide). It looks like:
        // https://script.google.com/macros/s/AKfycb.../exec
        // ============================================================
        var SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyIZuGNX9CYP0PUN7Ozg5odMVxMvcrNLRoFHNj0cCZqtOYapaPMvNJYQP50tK7yqnc/exec";

        function sheetConfigured() {
            return SHEET_API_URL && SHEET_API_URL.indexOf('PASTE_YOUR') !== 0;
        }

        // Pulls the latest data from the Google Sheet. Called on page load,
        // and again every 15 seconds so changes made on OTHER devices show
        // up here too (Google Sheets can't "push" updates like Firebase can,
        // so this checks in periodically instead).
        function loadFromSheet(showErrors) {
            if (!sheetConfigured()) {
                updateFileSyncStatus(false, '⚠️ Paste your Google Sheet Web App URL into SHEET_API_URL near the top of the script to enable cloud sync.');
                return;
            }
            fetch(SHEET_API_URL)
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (Array.isArray(data.invoices)) fullData = data.invoices;
                    if (data.parties && typeof data.parties === 'object') partyDatabase = data.parties;

                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(fullData));
                        localStorage.setItem(PARTY_STORAGE_KEY, JSON.stringify(partyDatabase));
                    } catch (e) { /* localStorage is just a fast local cache here */ }

                    updateFileSyncStatus(true, '📊 Synced to Google Sheet');

                    var container = document.getElementById('mainContainer');
                    if (container && container.className.indexOf('hidden') === -1) {
                        applyFilters();
                    }
                })
                .catch(function (err) {
                    console.error('Google Sheet load failed:', err);
                    if (showErrors) {
                        updateFileSyncStatus(false, '⚠️ Could not reach Google Sheet — check the Web App URL and that it is deployed with access "Anyone".');
                    }
                });
        }

        // Pushes the CURRENT full data set to the Google Sheet, replacing
        // whatever was there before (simplest way to keep it always correct).
        function saveToSheet() {
            if (!sheetConfigured()) return;
            fetch(SHEET_API_URL, {
                method: 'POST',
                // text/plain avoids a CORS "preflight" request that Apps
                // Script web apps don't handle — this is the standard trick.
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ invoices: fullData, parties: partyDatabase })
            })
                .then(function () {
                    updateFileSyncStatus(true, '📊 Synced to Google Sheet');
                })
                .catch(function (err) {
                    console.error('Google Sheet save failed:', err);
                    updateFileSyncStatus(false, '⚠️ Save to Google Sheet failed — check your internet connection.');
                });
        }

        // ============================================================
        // LOGIN SYSTEM
        // ============================================================

        document.getElementById('adminLoginBtn').onclick = function() {
            loginUser('admin');
        };

        document.getElementById('userLoginBtn').onclick = function() {
            loginUser('user');
        };

        document.getElementById('loginPass').onkeydown = function(e) {
            if (e.key === 'Enter') {
                attemptLogin();
            }
        };

        document.getElementById('loginUser').onkeydown = function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginPass').focus();
            }
        };

        // Pressing Enter (instead of clicking a specific Admin/User button)
        // now checks the typed credentials against BOTH roles automatically,
        // so the login form works correctly no matter how it's submitted.
        function attemptLogin() {
            var username = document.getElementById('loginUser').value.trim();
            var password = document.getElementById('loginPass').value.trim();
            var errorEl = document.getElementById('loginError');

            errorEl.textContent = '';

            if (!username || !password) {
                errorEl.textContent = '⚠️ Please enter both username and password.';
                return;
            }

            if (username === 'admin' && password === 'admin123') {
                loginUser('admin');
            } else if (username === 'user' && password === 'user123') {
                loginUser('user');
            } else {
                errorEl.textContent = '❌ Invalid username or password.';
                document.getElementById('loginPass').value = '';
                document.getElementById('loginPass').focus();
            }
        }

        function loginUser(role) {
            var username = document.getElementById('loginUser').value.trim();
            var password = document.getElementById('loginPass').value.trim();
            var errorEl = document.getElementById('loginError');

            errorEl.textContent = '';

            if (!username || !password) {
                errorEl.textContent = '⚠️ Please enter both username and password.';
                return;
            }

            if (role === 'admin') {
                if (username === 'admin' && password === 'admin123') {
                    errorEl.textContent = '';
                    saveLoginSession('admin');
                    showApp('admin');
                } else {
                    errorEl.textContent = '❌ Invalid! Use: admin / admin123';
                    document.getElementById('loginPass').value = '';

                var perm = await localFileHandle.requestPermission({ mode: 'readwrite' });
                if (perm !== 'granted') {
                    alert('⚠️ Permission was not granted, so local file sync is off.');
                    localFileHandle = null;
                    updateFileSyncStatus(false);
                    return;
                }
                // Write current data immediately so the file is populated right away.
                await writeToLocalFile();
                updateFileSyncStatus(true, localFileHandle.name);
            } catch (e) {
                // User cancelled the picker — not an error worth alarming them about.
                if (e && e.name !== 'AbortError') {
                    console.error('Could not connect local file:', e);
                }
            }
        }

        async function writeToLocalFile() {
            if (!localFileHandle) return;
            try {
                var payload = {
                    savedAt: new Date().toISOString(),
                    invoices: fullData,
                    parties: partyDatabase
                };
                var writable = await localFileHandle.createWritable();
                await writable.write(JSON.stringify(payload, null, 2));
                await writable.close();
            } catch (e) {
                console.error('Could not write to local file:', e);
                updateFileSyncStatus(false);
                localFileHandle = null;
                alert('⚠️ Lost access to the local file. Please click "Connect Local File" again.');
            }
        }

        // ------------------------------------------------------------
        // Universal backup download — works on every browser and OS,
        // including Android/iOS where the File System Access API above
        // is not available. Saves a single JSON snapshot to Downloads.
        // ------------------------------------------------------------
        function downloadBackup() {
            var payload = {
                savedAt: new Date().toISOString(),
                invoices: fullData,
                parties: partyDatabase
            };
            var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            var stamp = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = 'kiwi_tax_invoice_backup_' + stamp + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function saveLoginSession(role) {
            try {
                localStorage.setItem(LOGIN_STORAGE_KEY, JSON.stringify({
                    role: role,
                    savedAt: new Date().getTime()
                }));
            } catch (e) {
                console.warn('Login session could not be saved:', e);
            }
        }

        function getLoginSession() {
            try {
                var saved = localStorage.getItem(LOGIN_STORAGE_KEY);
                if (!saved) return null;
                var session = JSON.parse(saved);
                if (session && (session.role === 'admin' || session.role === 'user')) return session.role;
            } catch (e) {
                console.warn('Login session could not be loaded:', e);
            }
            return null;
        }

        function clearLoginSession() {
            try {
                localStorage.removeItem(LOGIN_STORAGE_KEY);
            } catch (e) {
                console.warn('Login session could not be cleared:', e);
            }
        }

        // Merge previously saved party details into the built-in database.
        try {
            var savedParties = JSON.parse(localStorage.getItem(PARTY_STORAGE_KEY) || '{}');
            if (savedParties && typeof savedParties === 'object') {
                Object.keys(savedParties).forEach(function(id) {
                    if (id) partyDatabase[id] = savedParties[id];
                });
            }
        } catch (e) {
            console.warn('Party database could not be loaded:', e);
        }

        // ============================================================
        // INIT APP
        // ============================================================

        // ============================================================
        // AUTO-UPDATING DATES (month badge + footer "report generated")
        // ------------------------------------------------------------
        // Both are computed fresh from the system clock every time the
        // page loads/refreshes, so August, September, etc. take over
        // automatically — nothing to edit by hand each month.
        // ============================================================

        var MONTH_NAMES = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE',
            'JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
        var MONTH_NAMES_SHORT = ['Jan','Feb','Mar','Apr','May','Jun',
            'Jul','Aug','Sep','Oct','Nov','Dec'];

        function updateHeaderDates(today) {
            today = today || new Date();

            var badge = document.getElementById('monthBadge');
            if (badge) {
                badge.textContent = '📅 ' + MONTH_NAMES[today.getMonth()] + ' ' + today.getFullYear();
            }

            var genDate = document.getElementById('reportGeneratedDate');
            if (genDate) {
                genDate.textContent = today.getDate() + ' ' + MONTH_NAMES_SHORT[today.getMonth()] + ' ' + today.getFullYear();
            }

            var footerMonth = document.getElementById('footerMonthLabel');
            if (footerMonth) {
                var monthName = MONTH_NAMES[today.getMonth()];
                var properCase = monthName.charAt(0) + monthName.slice(1).toLowerCase();
                footerMonth.textContent = properCase + ' ' + today.getFullYear();
            }
        }

        function initApp(admin) {
            isAdmin = admin;

            var connectFileBtn = document.getElementById('connectFileBtn');
            if (connectFileBtn) connectFileBtn.onclick = connectLocalFile;
            var downloadBackupBtn = document.getElementById('downloadBackupBtn');
            if (downloadBackupBtn) downloadBackupBtn.onclick = downloadBackup;
            updateFileSyncStatus(!!localFileHandle, localFileHandle ? localFileHandle.name : null);

            var tbody = document.getElementById('invoiceTableBody');
            var searchInput = document.getElementById('partySearch');
            var searchBtn = document.getElementById('searchBtn');
            var clearBtn = document.getElementById('clearSearch');
            var resultCount = document.getElementById('resultCount');

            var dateFrom = document.getElementById('dateFrom');
            var dateTo = document.getElementById('dateTo');
            var applyDateFilter = document.getElementById('applyDateFilter');
            var clearDateFilterBtn = document.getElementById('clearDateFilter');
            var dateFilterCount = document.getElementById('dateFilterCount');

            var totalInvEl = document.getElementById('totalInvoices');
            var totalTaxEl = document.getElementById('totalTax');
            var totalExEl = document.getElementById('totalExValue');
            var totalSaleEl = document.getElementById('totalSale');

            var newPartyId = document.getElementById('newPartyId');
            var newParty = document.getElementById('newParty');
            var newNtrn = document.getElementById('newNtrn');
            var newStrn = document.getElementById('newStrn');
            var newInv = document.getElementById('newInv');
            var newDate = document.getElementById('newDate');
            var newTax = document.getElementById('newTax');
            var newEx = document.getElementById('newEx');
            var newSale = document.getElementById('newSale');
            var addBtn = document.getElementById('addEntryBtn');
            var resetBtn = document.getElementById('resetDataBtn');
            var autoHint = document.getElementById('autoHint');
            var idHint = document.getElementById('idHint');

            function formatNumber(n) {
                return n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            }

            function formatCurrency(n) {
                return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            function computeTotals(data) {
                var inv = data.length;
                var tax = 0, ex = 0, sale = 0;
                data.forEach(function(r) {
                    tax += r.tax;
                    ex += r.ex;
                    sale += r.sale;
                });
                return { inv: inv, tax: tax, ex: ex, sale: sale };
            }

            function findPartyByPartyId(partyId) {
                var trimmed = partyId.trim();
                if (!trimmed) return null;
                return partyDatabase[trimmed] || null;
            }

            function handlePartyIdAutoFill() {
                var idVal = newPartyId.value.trim();

                // Reset styling first.
                newParty.classList.remove('auto-filled');
                newNtrn.classList.remove('auto-filled');
                newStrn.classList.remove('auto-filled');

                if (!idVal) {
                    idHint.textContent = '';
                    autoHint.textContent = '';
                    newParty.value = '';
                    newNtrn.value = '';
                    newStrn.value = '';
                    setPartyFieldsEditable(true);
                    return;
                }

                var details = findPartyByPartyId(idVal);
                if (details) {
                    newParty.value = details.name || '';
                    newNtrn.value = details.ntrn || '';
                    newStrn.value = details.strn || '';
                    idHint.textContent = '✅ Party found';
                    idHint.style.color = '#0f7b3e';
                    autoHint.textContent = '✅ Auto-filled';
                    autoHint.style.color = '#0f7b3e';
                    newParty.classList.add('auto-filled');
                    newNtrn.classList.add('auto-filled');
                    newStrn.classList.add('auto-filled');

                    // Known party: keep user-mode master data protected.
                    setPartyFieldsEditable(isAdmin);
                } else {
                    idHint.textContent = '➕ New Party ID — enter party details below';
                    idHint.style.color = '#0b2b3f';
                    autoHint.textContent = '✏️ New party: Name / NTRN / STRN can be entered';
                    autoHint.style.color = '#0b2b3f';

                    // IMPORTANT: unknown/new parties must be editable for BOTH roles.
                    setPartyFieldsEditable(true);
                }
            }

            function setPartyFieldsEditable(editable) {
                newParty.readOnly = !editable;
                newNtrn.readOnly = !editable;
                newStrn.readOnly = !editable;
                if (editable) {
                    newParty.classList.remove('readonly-field');
                    newNtrn.classList.remove('readonly-field');
                    newStrn.classList.remove('readonly-field');
                } else if (!isAdmin) {
                    newParty.classList.add('readonly-field');
                    newNtrn.classList.add('readonly-field');
                    newStrn.classList.add('readonly-field');
                }
            }

            function applyFilters() {
                var filtered = fullData.slice();
                
                var fromDate = dateFrom.value;
                var toDate = dateTo.value;
                
                if (fromDate && toDate) {
                    filtered = filtered.filter(function(row) { return row.date >= fromDate && row.date <= toDate; });
                } else if (fromDate) {
                    filtered = filtered.filter(function(row) { return row.date >= fromDate; });
                } else if (toDate) {
                    filtered = filtered.filter(function(row) { return row.date <= toDate; });
                }
                
                var searchTerm = searchInput.value.trim().toUpperCase();
                if (searchTerm) {
                    filtered = filtered.filter(function(row) {
                        return row.party.toUpperCase().includes(searchTerm) || 
                            (row.partyId && row.partyId.includes(searchTerm));
                    });
                }
                
                renderTable(filtered);
                updateSummary(filtered);
                
                if (fromDate || toDate) {
                    dateFilterCount.textContent = '📅 ' + filtered.length + ' entries in range';
                } else {
                    dateFilterCount.textContent = '';
                }
            }

            function clearDateFilter() {
                dateFrom.value = '';
                dateTo.value = '';
                dateFilterCount.textContent = '';
                applyFilters();
            }

            function renderTable(data) {
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr class="empty-row"><td colspan="10">No entries found</td></tr>';
                    return;
                }

                var html = '';
                data.forEach(function(row) {
                    var dateFormatted = row.date ? row.date.replace(/-/g, '/') : '—';
                    var dataIndex = fullData.findIndex(function(d) {
                        return d.party === row.party && d.inv === row.inv && d.date === row.date;
                    });
                    var deleteIdx = dataIndex !== -1 ? dataIndex : 0;
                    
                    var deleteButton = isAdmin 
                        ? '<button class="btn-danger-small" onclick="deleteEntry(' + deleteIdx + ')">Delete</button>'
                        : '<button class="btn-danger-small disabled" onclick="alert(\'⚠️ User cannot delete\')">Delete</button>';
                    
                    html += '<tr>' +
                        '<td>' + (row.partyId || '—') + '</td>' +
                        '<td class="party-name">' + row.party + '</td>' +
                        '<td>' + (row.ntrn || '—') + '</td>' +
                        '<td>' + (row.strn || '—') + '</td>' +
                        '<td>' + row.inv + '</td>' +
                        '<td>' + dateFormatted + '</td>' +
                        '<td class="text-right">' + formatNumber(row.tax) + '</td>' +
                        '<td class="text-right">' + formatCurrency(row.ex) + '</td>' +
                        '<td class="text-right">' + formatNumber(row.sale) + '</td>' +
                        '<td class="delete-cell">' + deleteButton + '</td>' +
                    '</tr>';
                });
                tbody.innerHTML = html;
            }

            function updateSummary(data) {
                var totals = computeTotals(data);
                totalInvEl.textContent = totals.inv;
                totalTaxEl.textContent = formatNumber(totals.tax);
                totalExEl.textContent = formatCurrency(totals.ex);
                totalSaleEl.textContent = formatNumber(totals.sale);
                resultCount.textContent = data.length + ' entries';
            }

            window.deleteEntry = function(index) {
                if (!isAdmin) {
                    alert('⚠️ User cannot delete entries.');
                    return;
                }
                if (index >= 0 && index < fullData.length) {
                    if (confirm('Delete this entry?')) {
                        fullData.splice(index, 1);
                        saveData();
                        applyFilters();
                    }
                }
            };

            function resetData() {
                if (!isAdmin) {
                    alert('⚠️ User cannot reset data.');
                    return;
                }
                if (confirm('Reset all data?')) {
                    fullData = JSON.parse(JSON.stringify(initialData));
                    localStorage.removeItem(STORAGE_KEY);
                    searchInput.value = '';
                    clearDateFilter();
                    newPartyId.value = '';
                    newParty.value = '';
                    newNtrn.value = '';
                    newStrn.value = '';
                    newInv.value = '';
                    newTax.value = '';
                    newEx.value = '';
                    newSale.value = '';
                    autoHint.textContent = '';
                    idHint.textContent = '';
                    applyFilters();
                }
            }

            function addEntry() {
                var partyId = newPartyId.value.trim();
                var party = newParty.value.trim();
                var ntrn = newNtrn.value.trim();
                var strn = newStrn.value.trim();
                var inv = newInv.value.trim();
                var date = newDate.value;
                var tax = parseFloat(newTax.value);
                var ex = parseFloat(newEx.value);
                var sale = parseFloat(newSale.value);

                if (!partyId || !party || !inv || !date || isNaN(tax) || isNaN(ex) || isNaN(sale)) {
                    alert('⚠️ Please fill Party ID, Party Name, Invoice #, Date, Advance Tax, EX VALUE and TOTAL SALE.');
                    return;
                }

                // Strong duplicate invoice protection.
                var duplicate = fullData.find(function(r) {
                    return String(r.inv).trim().toUpperCase() === inv.toUpperCase();
                });
                if (duplicate) {
                    alert('⚠️ THESE INVOICE ALREADY EXIST!\n\nInvoice #: ' + inv +
                          '\nParty: ' + duplicate.party +
                          '\nDate: ' + (duplicate.date || '—'));
                    newInv.focus();
                    return;
                }

                var newRecord = {
                    partyId: partyId,
                    party: party,
                    ntrn: ntrn,
                    strn: strn,
                    inv: inv,
                    date: date,
                    tax: tax,
                    ex: ex,
                    sale: sale
                };

                fullData.push(newRecord);

                // Register a new party automatically so the next invoice auto-fills it.
                partyDatabase[partyId] = {
                    name: party,
                    ntrn: ntrn,
                    strn: strn
                };
                saveData();

                // Make the newly-added entry immediately visible.
                searchInput.value = '';
                if (dateFrom.value && dateTo.value &&
                    (date < dateFrom.value || date > dateTo.value)) {
                    dateFrom.value = '';
                    dateTo.value = '';
                    dateFilterCount.textContent = '';
                }

                newPartyId.value = '';
                newParty.value = '';
                newNtrn.value = '';
                newStrn.value = '';
                newInv.value = '';
                newDate.value = '';
                newTax.value = '';
                newEx.value = '';
                newSale.value = '';
                autoHint.textContent = '';
                idHint.textContent = '';
                setPartyFieldsEditable(true);

                applyFilters();
            }

            var today = new Date();
            var yyyy = today.getFullYear();
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var dd = String(today.getDate()).padStart(2, '0');
            newDate.value = yyyy + '-' + mm + '-' + dd;

            // Auto-set the date range filter to the CURRENT month, every time
            // the page is opened/refreshed — no more hardcoded "July 2026".
            var lastDay = new Date(yyyy, today.getMonth() + 1, 0).getDate();
            dateFrom.value = yyyy + '-' + mm + '-01';
            dateTo.value = yyyy + '-' + mm + '-' + String(lastDay).padStart(2, '0');

            updateHeaderDates(today);

            addBtn.onclick = addEntry;
            if (resetBtn) resetBtn.onclick = resetData;
            newPartyId.oninput = handlePartyIdAutoFill;
            
            searchBtn.onclick = applyFilters;
            searchInput.onkeydown = function(e) {
                if (e.key === 'Enter') applyFilters();
            };
            clearBtn.onclick = function() {
                searchInput.value = '';
                applyFilters();
            };
            
            applyDateFilter.onclick = applyFilters;
            clearDateFilterBtn.onclick = clearDateFilter;
            
            dateFrom.onkeydown = function(e) {
                if (e.key === 'Enter') applyFilters();
            };
            dateTo.onkeydown = function(e) {
                if (e.key === 'Enter') applyFilters();
            };

            applyFilters();
        }

        // Extra safety net: if this tab was left open and another tab/session
        // saved new data in the meantime, refresh + re-render as soon as the
        // user switches back to this tab — so it's never showing stale counts.
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState !== 'visible') return;
            var container = document.getElementById('mainContainer');
            if (!container || container.className.indexOf('hidden') !== -1) return;
            refreshDataFromStorage();
            initApp(isAdmin);
        });

        function doLogout() {
            if (confirm('Logout?')) {
                clearLoginSession();
                document.getElementById('mainContainer').className = 'container hidden';
                document.getElementById('loginOverlay').className = 'login-overlay';
                document.getElementById('loginUser').value = '';
                document.getElementById('loginPass').value = '';
                document.getElementById('loginError').textContent = '';
                document.getElementById('appContent').innerHTML = '';
                document.getElementById('loginUser').focus();
            }
        }

        // ============================================================
        // STARTUP / PERSISTENT LOGIN
        // ============================================================
        // If the user was already logged in, restore the app after refresh.
        // This is intentionally stored in localStorage so the single HTML
        // file works without PHP/MySQL/server-side login.
        (function restoreLoginAfterRefresh() {
            var savedRole = getLoginSession();
            if (savedRole) {
                showApp(savedRole);
            } else {
                document.getElementById('loginUser').focus();
            }
        })();

        // ============================================================
        // Start cloud sync: load the latest data from the Google Sheet
        // right away, then re-check every 15 seconds so entries added
        // on other devices/browsers show up here too.
        // ============================================================
        loadFromSheet(true);
        setInterval(function () { loadFromSheet(false); }, 15000);

        console.log('✅ KIWI Tax Invoice System Ready!');
        console.log('📋 Original records: ' + initialData.length);
        console.log('📋 Login Credentials:');
        console.log('  👑 Admin: admin / admin123');
        console.log('  👤 User:  user / user123');
    </script>
</body>
</html>
